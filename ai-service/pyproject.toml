[project]
name = "minewiki-ai-service"
version = "0.1.0"
description = "Microservicio de Inteligencia Artificial para MineWiki"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
