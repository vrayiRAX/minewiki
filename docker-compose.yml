version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: minewiki-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped

  myserver:
    build:
      context: ./myserver
      dockerfile: Dockerfile
    container_name: minewiki-backend-server
    ports:
      - "8080:8080"
    depends_on:
      - ai-service
    restart: unless-stopped
